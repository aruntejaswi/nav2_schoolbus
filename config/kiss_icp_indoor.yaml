kiss_icp_node:
  ros__parameters:
    data:
      deskew: True
      max_range: 10.0
      min_range: 0.5

    mapping:
      voxel_size: 0.1
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 0.5
      min_motion_th: 0.05

    registration:
      max_num_iterations: 500
      convergence_criterion: 0.0001
      max_num_threads: 2
