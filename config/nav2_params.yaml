controller_server:
    ros__parameters:
        # controller server parameters (see Controller Server for more info)
        controller_frequency: 20.0
        min_x_velocity_threshold: 0.001
        min_y_velocity_threshold: 0.5
        min_theta_velocity_threshold: 0.001
        progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
        goal_checker_plugins: ["goal_checker"]
        controller_plugins: ["FollowPath"]
        progress_checker:
            plugin: "nav2_controller::SimpleProgressChecker"
            required_movement_radius: 0.5
            movement_time_allowance: 10.0
        goal_checker:
            plugin: "nav2_controller::SimpleGoalChecker"
            xy_goal_tolerance: 0.25
            yaw_goal_tolerance: 0.25
            stateful: True
        # Regulated Pure Pursuit — required for Ackermann (no rotate-in-place)
        FollowPath:
            plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
            desired_linear_vel: 1.5
            lookahead_dist: 1.5
            min_lookahead_dist: 0.5
            max_lookahead_dist: 3.0
            lookahead_time: 1.5
            use_velocity_scaled_lookahead_dist: false
            min_approach_linear_velocity: 1.0
            approach_velocity_scaling_dist: 1.0
            use_collision_detection: false
            use_regulated_linear_velocity_scaling: true
            use_fixed_curvature_lookahead: false
            use_cost_regulated_linear_velocity_scaling: false
            regulated_linear_scaling_min_radius: 0.9
            regulated_linear_scaling_min_speed: 0.25
            use_rotate_to_heading: false
            allow_reversing: false
            rotate_to_heading_min_angle: 0.785
            max_angular_accel: 3.2
            max_robot_pose_search_dist: 10.0
            transform_tolerance: 0.2

# map_saver:
#     ros__parameters:
#         save_map_timeout: 5.0
#         free_thresh_default: 0.25
#         occupied_thresh_default: 0.65
#         map_subscribe_transient_local: True

planner_server:
    ros__parameters:
        expected_planner_frequency: 20.0
        planner_plugins: ["GridBased"]
        costmap_update_timeout: 1.0
        GridBased:
            plugin: "nav2_navfn_planner::NavfnPlanner"
            tolerance: 0.5
            use_astar: true
            allow_unknown: true
            use_final_approach_orientation: true

smoother_server:
    ros__parameters:
        smoother_plugins: ["simple_smoother"]
        robot_base_frame: base_footprint
        simple_smoother:
            plugin: "nav2_smoother::SimpleSmoother"
            tolerance: 1.0e-10
            max_its: 1000
            do_refinement: True

behavior_server:
    ros__parameters:
        local_costmap_topic: local_costmap/costmap_raw
        global_costmap_topic: global_costmap/costmap_raw
        local_footprint_topic: local_costmap/published_footprint
        global_footprint_topic: global_costmap/published_footprint
        cycle_frequency: 10.0
        behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]  # no spin: Ackermann cannot rotate in place
        backup:
            plugin: "nav2_behaviors::BackUp"
        drive_on_heading:
            plugin: "nav2_behaviors::DriveOnHeading"
        wait:
            plugin: "nav2_behaviors::Wait"
        assisted_teleop:
            plugin: "nav2_behaviors::AssistedTeleop"
        local_frame: odom
        global_frame: map
        robot_base_frame: base_footprint
        transform_tolerance: 0.9
        simulate_ahead_time: 2.0
        max_rotational_vel: 1.0
        min_rotational_vel: 0.4
        rotational_acc_lim: 3.2

waypoint_follower:
    ros__parameters:
        loop_rate: 20
        stop_on_failure: false
        action_server_result_timeout: 900.0
        waypoint_task_executor_plugin: "wait_at_waypoint"
        wait_at_waypoint:
            plugin: "nav2_waypoint_follower::WaitAtWaypoint"
            enabled: True
            waypoint_pause_duration: 200

velocity_smoother:
    ros__parameters:
        smoothing_frequency: 20.0
        scale_velocities: True
        feedback: "OPEN_LOOP"
        max_velocity: [2.5, 0.0, 2.0]
        min_velocity: [-2.5, 0.0, -2.0]
        max_accel: [2.5, 0.0, 3.2]
        max_decel: [-2.5, 0.0, -3.2]
        odom_topic: /odometry/local
        odom_duration: 0.1
        deadband_velocity: [0.1, 0.0, 0.1]
        velocity_timeout: 1.0

collision_monitor:
    ros__parameters:
        base_frame_id: "base_footprint"
        odom_frame_id: "odom"
        cmd_vel_in_topic: "cmd_vel_smoothed"
        cmd_vel_out_topic: "control/cmd_vel"
        state_topic: "collision_monitor_state"
        transform_tolerance: 0.9
        source_timeout: 1.0
        base_shift_correction: True
        stop_pub_timeout: 2.0
        # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
        # and robot footprint for "approach" action type.
        polygons: ["FootprintApproach"]
        FootprintApproach:
            type: "polygon"
            action_type: "approach"
            footprint_topic: "/local_costmap/published_footprint"
            time_before_collision: 1.2
            simulation_time_step: 0.1
            min_points: 6
            visualize: False
            enabled: True
        observation_sources: ["pointcloud"]
        pointcloud:
            type: "pointcloud"
