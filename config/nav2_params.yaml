amcl:
    ros__parameters:
        use_sim_time: False
        alpha1: 0.2
        alpha2: 0.2
        alpha3: 0.2
        alpha4: 0.2
        alpha5: 0.2
        base_frame_id: "base_footprint"
        global_frame_id: "map"
        laser_max_range: 10.0
        laser_min_range: 0.5
        laser_model_type: "likelihood_field"
        max_beams: 60
        max_particles: 2000
        min_particles: 500
        odom_frame_id: "odom"
        robot_model_type: "nav2_amcl::DifferentialMotionModel"
        tf_broadcast: true
        transform_tolerance: 1.0
        scan_topic: /velodyne_scan
        set_initial_pose: true
        initial_pose_x: 0.0
        initial_pose_y: 0.0
        initial_pose_z: 0.0
        initial_pose_yaw: 0.0
        always_reset_initial_pose: false
        first_map_only: false

bt_navigator:
    ros__parameters:
        global_frame: map
        robot_base_frame: base_footprint
        odom_topic: /odometry/local
        bt_loop_duration: 10
        default_server_timeout: 20
        wait_for_service_timeout: 1000
        action_server_result_timeout: 900.0
        navigators: ["navigate_to_pose", "navigate_through_poses"]
        navigate_to_pose:
            plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
        navigate_through_poses:
            plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
        # Spin-free BT: robot cannot rotate in place (Ackermann)
        default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"
        default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"
        error_code_names:
            - compute_path_error_code
            - follow_path_error_code

