local_costmap:
    local_costmap:
        ros__parameters:
            update_frequency: 10.0
            publish_frequency: 2.0
            always_send_full_costmap: True
            global_frame: odom
            robot_base_frame: base_footprint
            rolling_window: true
            width: 20
            height: 20
            resolution: 0.1
            robot_radius: 0.65
            plugins: ["obstacle_layer", "inflation_layer"]
            # static_layer:
            #     plugin: "nav2_costmap_2d::StaticLayer"
            #     enabled: true
            #     map_subscribe_transient_local: True
            stvl_layer:
                plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
                enabled: true
                voxel_decay: 1.0
                decay_model: 0
                voxel_size: 0.1
                track_unknown_space: true
                unknown_threshold: 15
                mark_threshold: 0
                update_footprint_enabled: true
                combination_method: 1
                origin_z: 0.0
                publish_voxel_map: true
                transform_tolerance: 0.9
                mapping_mode: false
                # map_save_duration: 60.0
                observation_sources: pointcloud
                pointcloud:
                    data_type: PointCloud2
                    topic: /velodyne_points
                    marking: true
                    clearing: true
                    obstacle_range: 10.0
                    min_obstacle_height: 0.0
                    max_obstacle_height: 1.5
                    expected_update_rate: 0.0
                    observation_persistence: 0.0
                    inf_is_valid: false
                    filter: "voxel"
                    voxel_min_points: 0
                    clear_after_reading: true
                    max_z: 2.0
                    min_z: 0.1
                    # vertical_fov_angle: 0.75
                    # horizontal_fov_angle: 1.048
                    decay_acceleration: 15.0
                    model_type: 1
            obstacle_layer:
                plugin: "nav2_costmap_2d::ObstacleLayer"
                enabled: true
                observation_sources: pointcloud
                pointcloud:
                    data_type: PointCloud2
                    topic: /velodyne_points
                    obstacle_range: 10.0
                    min_obstacle_height: 0.0
                    max_obstacle_height: 1.5
                    max_obstacle_distance: 10.0
                    min_z: 0.1
                    max_z: 2.0
                    filter: "voxel"
                    voxel_min_points: 0
                    clearing: true
                    marking: true
            denoise_layer:
                plugin: "nav2_costmap_2d::DenoiseLayer"
                enabled: true
                minimal_group_size: 2
                group_connectivity_type: 8
            inflation_layer:
                plugin: "nav2_costmap_2d::InflationLayer"
                cost_scaling_factor: 3.0
                inflation_radius: 0.35
            # white_line_layer:
            #     plugin: "nav2_costmap_2d::StaticLayer"
            #     map_topic: /white_line_map
            #     subscribe_to_updates: true
            #     track_unknown_space: false
            #     lethal_cost_threshold: 30
            #     unknown_cost_value: 0
            #     trinary_costmap: false             # IMPORTANT: keep full 0–100 range, not binarized
            #     enabled: true
            line_stvl_layer:
                plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
                enabled: true
                voxel_decay: 10.0                 # Time before voxels decay (seconds)
                decay_model: 0                    # 0=linear, 1=exponential  
                voxel_size: 0.1                   # Match costmap resolution
                track_unknown_space: false        # Lines don't need unknown space
                unknown_threshold: 15
                mark_threshold: 0
                update_footprint_enabled: true
                combination_method: 1
                origin_z: 0.0
                publish_voxel_map: false          # Disable unless debugging
                transform_tolerance: 0.9
                mapping_mode: false
                observation_sources: camera_lines
                camera_lines:
                    data_type: PointCloud2
                    topic: /camera_line_points
                    marking: true
                    clearing: false                  # No raytracing clearing
                    obstacle_range: 5.0
                    min_obstacle_height: -0.1
                    max_obstacle_height: 0.1          # Thin ground layer for lines
                    expected_update_rate: 0.0         # Don't timeout on brief pauses
                    observation_persistence: 0.0
                    inf_is_valid: false
                    filter: "voxel"
                    voxel_min_points: 0
                    max_z: 0.1
                    min_z: -0.1



global_costmap:
    global_costmap:
        ros__parameters:
            update_frequency: 1.0
            publish_frequency: 1.0
            always_send_full_costmap: True
            global_frame: map
            robot_base_frame: base_footprint
            rolling_window: true
            width: 20
            height: 20
            robot_radius: 0.65
            resolution: 0.2
            track_unknown_space: true
            plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
            static_layer:
                plugin: "nav2_costmap_2d::StaticLayer"
                enabled: true
                map_subscribe_transient_local: True
            denoise_layer:
                plugin: "nav2_costmap_2d::DenoiseLayer"
                enabled: true
                minimal_group_size: 2
                group_connectivity_type: 8
            inflation_layer:
                plugin: "nav2_costmap_2d::InflationLayer"
                cost_scaling_factor: 3.0
                inflation_radius: 0.35
            obstacle_layer:
                plugin: "nav2_costmap_2d::ObstacleLayer"
                enabled: true
                observation_sources: pointcloud
                pointcloud:
                    data_type: PointCloud2
                    topic: /velodyne_points
                    obstacle_range: 20.0
                    min_obstacle_height: 0.0
                    max_obstacle_height: 2.0
                    max_obstacle_distance: 20.0
                    min_z: 0.1
                    max_z: 2.0
                    filter: "voxel"
                    voxel_min_points: 0
                    clearing: true
                    marking: true
            # white_line_layer:
            #     plugin: "nav2_costmap_2d::StaticLayer"
            #     map_topic: /white_line_map
            #     subscribe_to_updates: true
            #     track_unknown_space: false
            #     lethal_cost_threshold: 30
            #     unknown_cost_value: 0
            #     trinary_costmap: false             # IMPORTANT: keep full 0–100 range, not binarized
            #     enabled: true
            line_stvl_layer:
                plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
                enabled: true
                voxel_decay: 10.0                 # Time before voxels decay (seconds)
                decay_model: 0                    # 0=linear, 1=exponential  
                voxel_size: 0.1                   # Match costmap resolution
                track_unknown_space: false        # Lines don't need unknown space
                unknown_threshold: 15
                mark_threshold: 0
                update_footprint_enabled: true
                combination_method: 1
                origin_z: 0.0
                publish_voxel_map: false          # Disable unless debugging
                transform_tolerance: 0.9
                mapping_mode: false
                observation_sources: camera_lines
                camera_lines:
                    data_type: PointCloud2
                    topic: /camera_line_points
                    marking: true
                    clearing: false                  # No raytracing clearing
                    obstacle_range: 5.0
                    min_obstacle_height: -0.1
                    max_obstacle_height: 0.1          # Thin ground layer for lines
                    expected_update_rate: 0.0         # Don't timeout on brief pauses
                    observation_persistence: 0.0
                    inf_is_valid: false
                    filter: "voxel"
                    voxel_min_points: 0
                    max_z: 0.1
                    min_z: -0.1

slam_toolbox:
    ros__parameters:
        # Plugin params
        solver_plugin: solver_plugins::CeresSolver
        ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
        ceres_preconditioner: SCHUR_JACOBI
        ceres_trust_strategy: LEVENBERG_MARQUARDT
        ceres_dogleg_type: TRADITIONAL_DOGLEG
        ceres_loss_function: None

        # ROS Parameters
        odom_frame: odom
        map_frame: map
        base_frame: base_footprint
        scan_topic: /velodyne_scan
        odom_topic: /odometry/local
        use_map_saver: false
        mode: mapping #localization

        # if you'd like to immediately start continuing a map at a given pose
        # or at the dock, but they are mutually exclusive, if pose is given
        # will use pose
        #map_file_name: test_steve
        # map_start_pose: [0.0, 0.0, 0.0]
        #map_start_at_dock: true

        debug_logging: false
        throttle_scans: 1
        transform_publish_period: 0.05 #if 0 never publishes odometry
        map_update_interval: 2.0
        resolution: 0.05
        restamp_tf: true
        min_laser_range: 0.5
        max_laser_range: 10.0 #for rastering images
        minimum_time_interval: 0.1
        transform_timeout: 0.5
        tf_buffer_duration: 30.0
        stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
        enable_interactive_mode: true

        # General Parameters
        use_scan_matching: true
        use_scan_barycenter: true
        minimum_travel_distance: 0.05
        minimum_travel_heading: 0.05
        scan_buffer_size: 20
        scan_buffer_maximum_scan_distance: 10.0
        link_match_minimum_response_fine: 0.45
        link_scan_maximum_distance: 1.5
        loop_search_maximum_distance: 6.0
        do_loop_closing: true
        loop_match_minimum_chain_size: 5
        loop_match_maximum_variance_coarse: 3.0
        loop_match_minimum_response_coarse: 0.35
        loop_match_minimum_response_fine: 0.45

        # Correlation Parameters - Correlation Parameters
        correlation_search_space_dimension: 0.5
        correlation_search_space_resolution: 0.01
        correlation_search_space_smear_deviation: 0.1

        # Correlation Parameters - Loop Closure Parameters
        loop_search_space_dimension: 8.0
        loop_search_space_resolution: 0.05
        loop_search_space_smear_deviation: 0.03

        # Scan Matcher Parameters
        distance_variance_penalty: 0.5
        angle_variance_penalty: 1.0

        fine_search_angle_offset: 0.00349
        coarse_search_angle_offset: 0.5
        coarse_angle_resolution: 0.0349
        minimum_angle_penalty: 0.9
        minimum_distance_penalty: 0.5
        use_response_expansion: true
        min_pass_through: 1
        occupancy_threshold: 0.25

        # # Plugin params
        # solver_plugin: solver_plugins::CeresSolver
        # ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
